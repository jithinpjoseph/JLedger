<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c169"/>
      <stop offset="1" stop-color="#e4a63c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.9">
      <stop offset="0" stop-color="#e4a63c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e4a63c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="112" fill="#14150f"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="11" y="11" width="490" height="490" rx="102" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.5"/>

  <!-- monogram J -->
  <text x="232" y="352" font-family="Georgia, 'Iowan Old Style', 'Palatino Linotype', serif"
        font-size="300" text-anchor="middle" fill="url(#gold)">J</text>

  <!-- single price-tag accent, echoing the in-app mark -->
  <circle cx="366" cy="150" r="24" fill="url(#gold)"/>
</svg>
